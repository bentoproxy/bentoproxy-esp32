[package]
name = "bentoproxy-esp32"
version = "0.1.0"
authors = ["BentoProxy Contributors"]
edition = "2021"
license = "MIT"
description = "BentoProxy ESP32 node firmware"

[dependencies]
# ESP32 HAL and runtime - using 0.51 with ESP-IDF v5.3
esp-idf-svc = { version = "0.51", default-features = false, features = ["binstart", "std"] }
esp-idf-hal = "0.45"
esp-idf-sys = { version = "0.36", features = ["binstart"] }

# Protocol
bentoproxy-protocol = { path = "../bentoproxy-protocol" }

# Utilities
log = "0.4"
anyhow = "1.0"
embedded-svc = "0.28"

[features]
# Measure raw network capacity at boot instead of trusting relay numbers.
# Diagnostic builds only; production firmware never sends this traffic.
netdiag = []
# Hang the relay loop on purpose once relaying, to prove the watchdog reboots
# the node. Test builds only.
wdt-selftest = []

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[profile.release]
opt-level = "z"     # Optimize for size
lto = true
codegen-units = 1
debug = false
# Keep symbols: espflash reads the app descriptor out of the ELF, and a
# stripped binary makes it report the descriptor as missing.
strip = false

[profile.dev]
debug = true
opt-level = "z"     # Still optimize for size in debug

[[bin]]
name = "bentoproxy-esp32"
path = "src/main.rs"
