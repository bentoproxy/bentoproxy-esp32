[package]
name = "bentoproxy-esp32"
version = "0.1.0"
authors = ["BentoProxy Contributors"]
edition = "2021"
license = "MIT"
description = "BentoProxy ESP32 node firmware"

[dependencies]
# ESP32 HAL and runtime
esp-idf-svc = { version = "0.49", default-features = false }
esp-idf-hal = "0.44"
esp-idf-sys = "0.35"

# Async runtime for embedded
embassy-time = "0.3"
embassy-executor = { version = "0.6", features = ["arch-xtensa", "executor-thread"] }
embassy-sync = "0.6"

# Protocol
bentoproxy-protocol = { path = "../protocol", default-features = false }

# WebSocket client
embedded-websocket = "0.9"

# Utilities
heapless = "0.8"
log = "0.4"

[build-dependencies]
embuild = "0.32"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true
codegen-units = 1
debug = false
strip = true

[profile.dev]
debug = true
opt-level = "z"     # Still optimize for size in debug

[[bin]]
name = "bentoproxy-esp32"
path = "src/main.rs"
